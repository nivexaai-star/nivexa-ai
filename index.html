<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIVEXA AI</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="assets/images/logo.png" alt="Logo NIVEXA AI">
    </div>

    <nav>
        <a href="#">Beranda</a>
        <a href="#">Fitur</a>
        <a href="#">Tentang</a>
    </nav>

</header>

<main class="hero">

    <p class="label">
        AI PHOTO TO VIDEO
    </p>

    <h1>
        Ubah Foto Menjadi Video AI yang Menakjubkan
    </h1>

    <p class="description">
        Buat foto menjadi video bergerak dengan teknologi AI yang cepat,
        mudah, dan profesional.
    </p>

    <div class="buttons">

        <button
            id="uploadBtn"
            class="primary"
            type="button">
            Upload Foto
        </button>

        <button
            class="secondary"
            type="button">
            Lihat Contoh
        </button>

    </div>

</main>

<script>

document.getElementById("uploadBtn").addEventListener("click", function () {

    const user = localStorage.getItem("nivexaUser");

    if (!user) {

        alert("Silakan login terlebih dahulu.");

        window.location.href = "pages/login.html";

        return;
    }

    window.location.href = "pages/dashboard.html";

});

</script>

</body>
</html>
