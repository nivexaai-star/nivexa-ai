<script>
   const textPanel =
    document.getElementById("textPanel");

const textInput =
    document.getElementById("textInput");

const textColor =
    document.getElementById("textColor");

    const textColorDots =
    document.querySelectorAll(".text-color-dot");

textColorDots.forEach(function(dot) {
    dot.addEventListener("click", function() {
        const warnaDipilih =
            this.getAttribute("data-color");

        textColor.value = warnaDipilih;

        textColorDots.forEach(function(item) {
            item.classList.remove("active");
        });

        this.classList.add("active");
    });
});

const addTextBtn =
    document.getElementById("addTextBtn");

const cancelTextBtn =
    document.getElementById("cancelTextBtn");

    let undoStack = [];
let redoStack = [];
const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");
    const overlayBtn =
    document.getElementById("overlayBtn");

const overlayInput =
    document.getElementById("overlayInput");

let overlayImage = null;
let elemenTeksAktif = null;

function simpanUndo() {
    if (!overlayImage) return;

    undoStack.push({
        overlayImage: overlayImage,
        parent: overlayImage.parentElement
    });

    redoStack = [];
}
undoBtn.addEventListener("click", function () {
    if (undoStack.length === 0) return;

    const state = undoStack.pop();
    redoStack.push(state);

    if (state.overlayImage) {
        state.overlayImage.remove();
    }

    overlayImage =
        undoStack.length > 0
            ? undoStack[undoStack.length - 1].overlayImage
            : null;
});

redoBtn.addEventListener("click", function () {
    if (redoStack.length === 0) return;

    const state = redoStack.pop();

    if (state.overlayImage && state.parent) {
        state.parent.appendChild(state.overlayImage);
        overlayImage = state.overlayImage;

        undoStack.push(state);
    }
});

overlayBtn.addEventListener("click", function () {
    overlayInput.click();
});

overlayInput.addEventListener("change", function () {
    const file = overlayInput.files[0];

    if (!file) {
        return;
    }


    const foto =
        document.getElementById("fotoPreview");

    if (!foto) {
        alert("Pilih foto utama terlebih dahulu.");
        overlayInput.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function (event) {
        overlayImage = document.createElement("img");
        const currentOverlay = overlayImage;

        overlayImage.src = event.target.result;
        overlayImage.className = "overlay-image";

        overlayImage.style.position = "absolute";
        overlayImage.style.width = "120px";
        overlayImage.style.height = "auto";
        overlayImage.style.left = "50%";
        overlayImage.style.top = "50%";
        overlayImage.style.transform =
            "translate(-50%, -50%)";
        overlayImage.style.zIndex = "20";
        overlayImage.style.cursor = "move";

        foto.parentElement.style.position =
            "relative";

        foto.parentElement.appendChild(
            overlayImage
        );
        simpanUndo();
let sedangGeser = false;
let offsetX = 0;
let offsetY = 0;
overlayImage.style.touchAction = "none";
currentOverlay.addEventListener("pointerdown", function (event) {
    sedangGeser = true;

    const rect =
        currentOverlay.getBoundingClientRect();

    offsetX =
        event.clientX - rect.left;

    offsetY =
        event.clientY - rect.top;

    currentOverlay.setPointerCapture(
        event.pointerId
    );
});

currentOverlay.addEventListener("pointermove", function (event) {
    if (!sedangGeser) return;

    const parentRect =
        foto.parentElement.getBoundingClientRect();

    let x =
        event.clientX -
        parentRect.left -
        offsetX;

    let y =
        event.clientY -
        parentRect.top -
        offsetY;

     currentOverlay.style.left =
        x + "px";
currentOverlay.style.top =
    y + "px";
});

overlayImage.addEventListener("pointerup", function (event) {
    sedangGeser = false;

    overlayImage.releasePointerCapture(
        event.pointerId
    );
});

currentOverlay.addEventListener("pointerup", function (event) {
    sedangGeser = false;
});
let jarakAwal = 0;
let lebarAwal = 0;

currentOverlay.style.touchAction = "none";

currentOverlay.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) {
        sedangGeser = false;

        const dx =
            e.touches[0].clientX - e.touches[1].clientX;
        const dy =
            e.touches[0].clientY - e.touches[1].clientY;

        jarakAwal = Math.hypot(dx, dy);
        lebarAwal = currentOverlay.offsetWidth;

        e.preventDefault();
    }
}, { passive: false });

currentOverlay.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2 && jarakAwal > 0) {
        const dx =
            e.touches[0].clientX - e.touches[1].clientX;
        const dy =
            e.touches[0].clientY - e.touches[1].clientY;

        const jarakSekarang = Math.hypot(dx, dy);
        const skala = jarakSekarang / jarakAwal;

        let lebarBaru = lebarAwal * skala;

        lebarBaru = Math.max(50, Math.min(500, lebarBaru));

        currentOverlay.style.width =
    lebarBaru + "px";

currentOverlay.style.height =
    "auto";

        e.preventDefault();
    }
}, { passive: false });

overlayImage.addEventListener("touchend", function (e) {
    if (e.touches.length < 2) {
        jarakAwal = 0;
    }
});
    };
    reader.readAsDataURL(file);
});
    const ratioBtn = document.getElementById("ratioBtn");
const ratioOptions = document.getElementById("ratioOptions");
const pilihanRasio = [
    "Asli",
    "1:1",
    "4:5",
    "9:16",
    "16:9"
];

let ratioIndex = 0;

ratioBtn.addEventListener("click", function () {
    ratioOptions.classList.toggle("show");
});
ratioOptions
    .querySelectorAll("button")
    .forEach(function (button) {

        button.addEventListener("click", function () {

            const foto =
                document.getElementById("fotoPreview");

            if (!foto) {
                alert("Pilih foto terlebih dahulu.");
                return;
            }

            const rasio =
                button.getAttribute("data-ratio");
                ratioOptions
    .querySelectorAll("button")
    .forEach(function (item) {
        item.classList.remove("active");
    });

button.classList.add("active");

            if (rasio === "Asli") {
                foto.style.aspectRatio = "auto";
                foto.style.objectFit = "contain";
            }

            if (rasio === "1:1") {
                foto.style.aspectRatio = "1 / 1";
                foto.style.objectFit = "cover";
            }

            if (rasio === "4:5") {
                foto.style.aspectRatio = "4 / 5";
                foto.style.objectFit = "cover";
            }

            if (rasio === "9:16") {
                foto.style.aspectRatio = "9 / 16";
                foto.style.objectFit = "cover";
            }

            if (rasio === "16:9") {
                foto.style.aspectRatio = "16 / 9";
                foto.style.objectFit = "cover";
            }

            ratioOptions.classList.remove("show");
        });
    });
    
    const fotoInput = document.getElementById("fotoInput");
    const uploadBox = document.querySelector(".upload-box");

    fotoInput.addEventListener("change", function () {
    const file = fotoInput.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("File harus berupa gambar.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function (event) {
        let foto = document.getElementById("fotoPreview");

        if (!foto) {
            foto = document.createElement("img");
            foto.id = "fotoPreview";

            foto.style.maxWidth = "100%";
            foto.style.maxHeight = "430px";
            foto.style.objectFit = "contain";
            foto.style.borderRadius = "14px";

            uploadBox.innerHTML = "";
            uploadBox.appendChild(foto);
            uploadBox.appendChild(textPanel);
        }

        foto.src = event.target.result;
    };

    reader.readAsDataURL(file);
});

let filterIndex = 0;

const contrastRange =

document

addTextBtn.addEventListener("click", function () {
    const foto = document.getElementById("fotoPreview");

    const teks = textInput.value.trim();
    const warna = textColor.value;

    if (!foto) return;

if (!teks && elemenTeksAktif) {
    elemenTeksAktif.remove();
    elemenTeksAktif = null;

    textPanel.style.display = "none";
    document.querySelector(".toolbar").style.display = "flex";
    textInput.blur();

    return;
}

if (!teks) return;

    if (elemenTeksAktif) {
    elemenTeksAktif.textContent = teks;
    elemenTeksAktif.style.color = warna;

    elemenTeksAktif = null;

    textPanel.style.display = "none";
    document.querySelector(".toolbar").style.display = "flex";
    textInput.blur();

    return;
}

    const elemenTeks = document.createElement("div");

        elemenTeks.textContent = teks;
elemenTeks.className = "teks-tambahan";
        elemenTeks.style.position = "absolute";
        elemenTeks.style.left = "50%";
        elemenTeks.style.bottom = "30px";
        elemenTeks.style.transform = "translateX(-50%)";
        elemenTeks.style.color = warna;
        elemenTeks.style.fontSize = "32px";
        elemenTeks.style.fontWeight = "bold";
        elemenTeks.style.textShadow = "0 2px 6px black";
        elemenTeks.style.zIndex = "10";

        foto.parentElement.style.position = "relative";
        foto.parentElement.appendChild(elemenTeks);
        elemenTeks.style.cursor = "move";
elemenTeks.style.touchAction = "none";

let sedangGeser = false;
let sudahBergerak = false;
let offsetX = 0;
let offsetY = 0;
let mulaiX = 0;
let mulaiY = 0;

elemenTeks.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();

    sedangGeser = true;
    sudahBergerak = false;
    mulaiX = e.clientX;
    mulaiY = e.clientY;

    const rect = elemenTeks.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    elemenTeks.setPointerCapture(e.pointerId);

    elemenTeks.style.transform = "none";
    elemenTeks.style.bottom = "auto";
});

elemenTeks.addEventListener("pointermove", function (e) {
    if (!sedangGeser) return;

const jarakX = Math.abs(e.clientX - mulaiX);
const jarakY = Math.abs(e.clientY - mulaiY);

if (jarakX < 8 && jarakY < 8) return;

sudahBergerak = true;

    const parentRect =
        foto.parentElement.getBoundingClientRect();

    let x =
        e.clientX -
        parentRect.left -
        offsetX;

    let y =
        e.clientY -
        parentRect.top -
        offsetY;

    elemenTeks.style.left = x + "px";
    elemenTeks.style.top = y + "px";
});

elemenTeks.addEventListener("pointerup", function (e) {
    e.preventDefault();
    e.stopPropagation();

    sedangGeser = false;

    if (!sudahBergerak) {
        elemenTeksAktif = elemenTeks;

        textInput.value = elemenTeks.textContent;
        textColor.value = elemenTeks.style.color || "#ffffff";

        textPanel.style.display = "block";
        document.querySelector(".toolbar").style.display = "none";

        setTimeout(function () {
            textInput.focus();
        }, 100);
    }
});
elemenTeks.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    e.stopPropagation();
});
elemenTeks.addEventListener("pointercancel", function () {
    sedangGeser = false;
});
textPanel.style.display = "none";
document.querySelector(".toolbar").style.display = "flex";
textInput.blur();
});
textInput.addEventListener("input", function () {
    if (!elemenTeksAktif) return;

    elemenTeksAktif.textContent = textInput.value;
});

if (overlayImage) {

    document
    .getElementById("downloadBtn")
    .addEventListener("click", function () {

        const foto =
            document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        const canvas =
            document.createElement("canvas");

        const ctx =
            canvas.getContext("2d");

       const rasioAktif =
    document.querySelector("#ratioOptions button.active")
        ?.getAttribute("data-ratio") || "Asli";

if (rasioAktif === "1:1") {
    canvas.width = 1080;
    canvas.height = 1080;
} else if (rasioAktif === "4:5") {
    canvas.width = 1080;
    canvas.height = 1350;
} else if (rasioAktif === "9:16") {
    canvas.width = 1080;
    canvas.height = 1920;
} else if (rasioAktif === "16:9") {
    canvas.width = 1920;
    canvas.height = 1080;
} else {
    canvas.width = foto.naturalWidth;
    canvas.height = foto.naturalHeight;
}

ctx.filter =
    foto.style.filter || "none";

const skalaFoto = Math.max(
    canvas.width / foto.naturalWidth,
    canvas.height / foto.naturalHeight
);

const lebarFoto =
    foto.naturalWidth * skalaFoto;

const tinggiFoto =
    foto.naturalHeight * skalaFoto;

ctx.save();

ctx.translate(
    canvas.width / 2,
    canvas.height / 2
);

ctx.rotate(
    rotasi * Math.PI / 180
);

ctx.scale(
    balikX,
    1
);

ctx.drawImage(
    foto,
    -lebarFoto / 2,
    -tinggiFoto / 2,
    lebarFoto,
    tinggiFoto
);

ctx.restore();
if (overlayImage) {
    const parent =
        foto.parentElement;

    const fotoRect =
        foto.getBoundingClientRect();

    const overlayRect =
        overlayImage.getBoundingClientRect();

    const scaleX =
        canvas.width / fotoRect.width;

    const scaleY =
        canvas.height / fotoRect.height;

    const overlayX =
        (overlayRect.left - fotoRect.left) * scaleX;

    const overlayY =
        (overlayRect.top - fotoRect.top) * scaleY;

    const overlayWidth =
        overlayRect.width * scaleX;

    const overlayHeight =
        overlayRect.height * scaleY;

    ctx.save();

    ctx.filter = "none";

    ctx.drawImage(
        overlayImage,
        overlayX,
        overlayY,
        overlayWidth,
        overlayHeight
    );

    ctx.restore();
}
        const teksTambahan =
            foto.parentElement.querySelectorAll(
                ".teks-tambahan"
            );

        teksTambahan.forEach(function (item) {

            ctx.font = "bold 64px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.shadowColor = "black";
            ctx.shadowBlur = 8;

            ctx.fillText(
                item.textContent,
                canvas.width / 2,
                canvas.height - 80
            );
        });

        canvas.toBlob(function (blob) {

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.href = url;
            link.download =
                "nivexa-edit-foto.jpg";

            document.body.appendChild(link);

            link.click();
            link.remove();

            setTimeout(function () {
                URL.revokeObjectURL(url);
            }, 1000);

        }, "image/jpeg", 0.95);
    });
