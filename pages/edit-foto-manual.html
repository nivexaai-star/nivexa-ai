<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Foto - NIVEXA AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #18213a, transparent 40%),
                linear-gradient(135deg, #060912, #0d1220);
            color: white;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(10, 14, 25, 0.9);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            background: linear-gradient(135deg, #6a5cff, #42c6ff);
        }

        .brand-text h2 {
            font-size: 18px;
        }

        .brand-text p {
            font-size: 12px;
            color: #9ca8bd;
            margin-top: 3px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #171d2b;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 28px 18px 50px;
        }

        .title {
            margin-bottom: 22px;
        }

        .title h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .title p {
            color: #9ba6bb;
            line-height: 1.5;
        }

        .editor-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
        }

        .toolbar {
            background: rgba(18, 24, 39, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
            height: fit-content;
        }

        .toolbar h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .tool-btn {
            width: 100%;
            border: none;
            color: white;
            background: #20283a;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }

        .tool-btn:hover {
            background: #2b3550;
        }

        .workspace {
            background: rgba(18, 24, 39, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 20px;
            min-height: 520px;
        }

        .upload-box {
            min-height: 440px;
            border: 2px dashed #46516c;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .upload-icon {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .upload-box h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #9ba6bb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #6657ff, #437cff);
            padding: 13px 24px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        #fotoInput {
            display: none;
        }

        .info {
            margin-top: 18px;
            padding: 14px;
            background: rgba(64, 111, 255, 0.1);
            border: 1px solid rgba(90, 130, 255, 0.2);
            border-radius: 12px;
            color: #b9c8f7;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 800px) {
            .header {
                padding: 14px;
            }

            .brand-text p {
                display: none;
            }

            .editor-layout {
                grid-template-columns: 1fr;
            }

            .toolbar {
    order: 2;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 12px;
    white-space: nowrap;
    border-radius: 14px;
    scrollbar-width: thin;
}

.toolbar h3 {
    display: none;
}

.toolbar .tool-btn,
.toolbar .control-group {
    flex: 0 0 auto;
    min-width: 120px;
    margin-bottom: 0;
}

.toolbar .control-group {
    width: 180px;
}

.toolbar .control-group input[type="range"] {
    width: 150px;
}

            .workspace {
                order: 1;
                min-height: auto;
                padding: 14px;
            }

            .upload-box {
                min-height: 280px;
                padding: 15px;
            }
            #fotoPreview {
    max-width: 100% !important;
    max-height: 300px !important;
    object-fit: contain;
}

            .title h1 {
                font-size: 24px;
            }
        }
        .control-group {
    background: #20283a;
    padding: 12px 13px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.control-group label {
    display: block;
    font-size: 14px;
    margin-bottom: 9px;
    color: white;
}

.control-group input[type="range"] {
    width: 100%;
    cursor: pointer;
}
    </style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">N</div>

        <div class="brand-text">
            <h2>NIVEXA AI</h2>
            <p>Edit Foto Manual</p>
        </div>
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Kembali
    </a>

</header>


<main class="container">

    <div class="title">
        <h1>🖼️ Edit Foto</h1>

        <p>
            Edit foto langsung di browser tanpa menggunakan kredit.
        </p>
    </div>


    <div class="editor-layout">

        <aside class="toolbar">

            <h3>Alat Edit</h3>

           <button class="tool-btn" id="cropBtn">
                ✂️ Crop / Potong
            </button>

            <button class="tool-btn" id="putarBtn">
    ↻ Putar Foto
</button>

            <button class="tool-btn" id="balikBtn">
    ↔️ Balik Foto
</button>

            <div class="control-group">
    <label for="brightnessRange">
        ☀️ Kecerahan
    </label>

    <input
        type="range"
        id="brightnessRange"
        min="50"
        max="150"
        value="100"
    >
</div>

<div class="control-group">
    <label for="contrastRange">
        ◐ Kontras
    </label>

    <input
        type="range"
        id="contrastRange"
        min="50"
        max="150"
        value="100"
    >
</div>

<div class="control-group">
    <label for="saturationRange">
        🎨 Saturasi
    </label>

    <input
        type="range"
        id="saturationRange"
        min="0"
        max="200"
        value="100"
    >
</div>

           <button class="tool-btn" id="filterBtn">
    ✨ Filter
</button>

           <button class="tool-btn" id="textBtn">
    T Tambah Teks
</button>

            <button class="tool-btn" id="resetBtn">
    ↻ Reset
</button>

        </aside>


        <section class="workspace">

            <div class="upload-box">

                <div class="upload-icon">
                    🖼️
                </div>

                <h2>Upload Foto Anda</h2>

                <p>
                    Pilih foto JPG, PNG atau WEBP untuk mulai mengedit.
                </p>

                <label
                    for="fotoInput"
                    class="upload-btn"
                >
                    Pilih Foto
                </label>

                <input
                    type="file"
                    id="fotoInput"
                    accept="image/jpeg,image/png,image/webp"
                >

            </div>
<button class="download-btn" id="downloadBtn" type="button">
    ⬇️ Download Foto
</button>

        </section>

    </div>

</main>
<script>
    const fotoInput = document.getElementById("fotoInput");
    const uploadBox = document.querySelector(".upload-box");

    fotoInput.addEventListener("change", function () {
    const file = fotoInput.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("File harus berupa gambar.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function (event) {
        let foto = document.getElementById("fotoPreview");

        if (!foto) {
            foto = document.createElement("img");
            foto.id = "fotoPreview";

            foto.style.maxWidth = "100%";
            foto.style.maxHeight = "430px";
            foto.style.objectFit = "contain";
            foto.style.borderRadius = "14px";

            uploadBox.innerHTML = "";
            uploadBox.appendChild(foto);
        }

        foto.src = event.target.result;
    };

    reader.readAsDataURL(file);
});
    let rotasi = 0;
let balikX = 1;

function updateTransformFoto() {
    const foto = document.getElementById("fotoPreview");

    if (!foto) return;

    foto.style.transform =
        `rotate(${rotasi}deg) scaleX(${balikX})`;

    foto.style.transition = "transform 0.3s ease";
}

document
    .getElementById("putarBtn")
    .addEventListener("click", function () {

        const foto = document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        rotasi = (rotasi + 90) % 360;
        updateTransformFoto();
    });
    document
    .getElementById("cropBtn")
    .addEventListener("click", function () {

        const foto =
            document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        if (foto.style.objectFit === "cover") {
            foto.style.objectFit = "contain";
            foto.style.width = "100%";
            foto.style.height = "auto";
        } else {
            foto.style.objectFit = "cover";
            foto.style.width = "100%";
            foto.style.height = "350px";
        }
    });
let filterIndex = 0;

const daftarFilter = [
    "none",
    "grayscale(100%)",
    "sepia(70%)",
    "contrast(120%) saturate(130%)",
    "brightness(110%) saturate(120%)"
];

document
    .getElementById("filterBtn")
    .addEventListener("click", function () {

        const foto = document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        filterIndex++;

        if (filterIndex >= daftarFilter.length) {
            filterIndex = 0;
        }

        foto.style.filter = daftarFilter[filterIndex];
    });
document
    .getElementById("balikBtn")
    .addEventListener("click", function () {

        const foto = document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        balikX *= -1;
        updateTransformFoto();
    });
    const brightnessRange =
    document.getElementById("brightnessRange");

const contrastRange =
    document.getElementById("contrastRange");

const saturationRange =
    document.getElementById("saturationRange");
let filterTambahan = "";
function updateFilterFoto() {
    const foto =
        document.getElementById("fotoPreview");

    if (!foto) return;

    const brightness = brightnessRange.value;
    const contrast = contrastRange.value;
    const saturation = saturationRange.value;

    foto.style.filter =
    `brightness(${brightness}%)
     contrast(${contrast}%)
     saturate(${saturation}%)
     ${filterTambahan}`;
}

document
    .getElementById("filterBtn")
    .addEventListener("click", function () {

        const foto =
            document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        filterIndex++;

        if (filterIndex >= daftarFilter.length) {
            filterIndex = 0;
        }

        filterTambahan =
            daftarFilter[filterIndex];

        updateFilterFoto();
    });
brightnessRange.addEventListener(
    "input",
    updateFilterFoto
);

contrastRange.addEventListener(
    "input",
    updateFilterFoto
);

saturationRange.addEventListener(
    "input",
    updateFilterFoto
);
document
    .getElementById("textBtn")
    .addEventListener("click", function () {

        const foto =
            document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        const teks = prompt("Masukkan teks:");

        if (!teks) return;

        const elemenTeks =
            document.createElement("div");

        elemenTeks.textContent = teks;
elemenTeks.className = "teks-tambahan";
        elemenTeks.style.position = "absolute";
        elemenTeks.style.left = "50%";
        elemenTeks.style.bottom = "30px";
        elemenTeks.style.transform = "translateX(-50%)";
        elemenTeks.style.color = "white";
        elemenTeks.style.fontSize = "32px";
        elemenTeks.style.fontWeight = "bold";
        elemenTeks.style.textShadow = "0 2px 6px black";
        elemenTeks.style.zIndex = "10";

        foto.parentElement.style.position = "relative";
        foto.parentElement.appendChild(elemenTeks);
    });
    document
    .getElementById("resetBtn")
    .addEventListener("click", function () {

        const foto =
            document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        rotasi = 0;
        balikX = 1;

        brightnessRange.value = 100;
        contrastRange.value = 100;
        saturationRange.value = 100;

        filterTambahan = "";

        foto.style.transform = "";
        foto.style.filter = "";

        const teksTambahan =
    foto.parentElement.querySelectorAll(".teks-tambahan");

        teksTambahan.forEach(function (item) {
    item.remove();
});

        updateTransformFoto();
        updateFilterFoto();
    });
    document
    document
    .getElementById("downloadBtn")
    .addEventListener("click", function () {

        const foto =
            document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        const canvas =
            document.createElement("canvas");

        const ctx =
            canvas.getContext("2d");

        canvas.width = foto.naturalWidth;
        canvas.height = foto.naturalHeight;

        ctx.filter = foto.style.filter || "none";

        ctx.save();

        ctx.translate(
            canvas.width / 2,
            canvas.height / 2
        );

        ctx.rotate(
            rotasi * Math.PI / 180
        );

        ctx.scale(
            balikX,
            1
        );

        ctx.drawImage(
            foto,
            -canvas.width / 2,
            -canvas.height / 2,
            canvas.width,
            canvas.height
        );

        ctx.restore();

        const teksTambahan =
            foto.parentElement.querySelectorAll(
                ".teks-tambahan"
            );

        teksTambahan.forEach(function (item) {

            ctx.font = "bold 64px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.shadowColor = "black";
            ctx.shadowBlur = 8;

            ctx.fillText(
                item.textContent,
                canvas.width / 2,
                canvas.height - 80
            );
        });

        canvas.toBlob(function (blob) {

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.href = url;
            link.download =
                "nivexa-edit-foto.jpg";

            document.body.appendChild(link);

            link.click();
            link.remove();

            setTimeout(function () {
                URL.revokeObjectURL(url);
            }, 1000);

        }, "image/jpeg", 0.95);
    });
</script>
</body>
</html>
