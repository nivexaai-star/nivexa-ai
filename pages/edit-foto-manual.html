<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Foto - NIVEXA AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #18213a, transparent 40%),
                linear-gradient(135deg, #060912, #0d1220);
            color: white;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(10, 14, 25, 0.9);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            background: linear-gradient(135deg, #6a5cff, #42c6ff);
        }

        .brand-text h2 {
            font-size: 18px;
        }

        .brand-text p {
            font-size: 12px;
            color: #9ca8bd;
            margin-top: 3px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #171d2b;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 28px 18px 50px;
        }

        .title {
            margin-bottom: 22px;
        }

        .title h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .title p {
            color: #9ba6bb;
            line-height: 1.5;
        }

        .editor-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
        }

        .toolbar {
            background: rgba(18, 24, 39, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
            height: fit-content;
        }

        .toolbar h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .tool-btn {
            width: 100%;
            border: none;
            color: white;
            background: #20283a;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }

        .tool-btn:hover {
            background: #2b3550;
        }

        .workspace {
            background: rgba(18, 24, 39, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 20px;
            min-height: 520px;
        }

        .upload-box {
            min-height: 440px;
            border: 2px dashed #46516c;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .upload-icon {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .upload-box h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #9ba6bb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #6657ff, #437cff);
            padding: 13px 24px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        #fotoInput {
            display: none;
        }

        .info {
            margin-top: 18px;
            padding: 14px;
            background: rgba(64, 111, 255, 0.1);
            border: 1px solid rgba(90, 130, 255, 0.2);
            border-radius: 12px;
            color: #b9c8f7;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 800px) {
            .header {
                padding: 14px;
            }

            .brand-text p {
                display: none;
            }

            .editor-layout {
                grid-template-columns: 1fr;
            }

            .toolbar {
                order: 2;
            }

            .workspace {
                order: 1;
                min-height: auto;
            }

            .upload-box {
                min-height: 360px;
            }

            .title h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">N</div>

        <div class="brand-text">
            <h2>NIVEXA AI</h2>
            <p>Edit Foto Manual</p>
        </div>
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Kembali
    </a>

</header>


<main class="container">

    <div class="title">
        <h1>🖼️ Edit Foto</h1>

        <p>
            Edit foto langsung di browser tanpa menggunakan kredit.
        </p>
    </div>


    <div class="editor-layout">

        <aside class="toolbar">

            <h3>Alat Edit</h3>

            <button class="tool-btn">
                ✂️ Crop / Potong
            </button>

            <button class="tool-btn">
                ↻ Putar Foto
            </button>

            <button class="tool-btn">
                ↔️ Balik Foto
            </button>

            <button class="tool-btn">
                ☀️ Kecerahan
            </button>

            <button class="tool-btn">
                ◐ Kontras
            </button>

            <button class="tool-btn">
                🎨 Saturasi
            </button>

            <button class="tool-btn">
                ✨ Filter
            </button>

            <button class="tool-btn">
                T Tambah Teks
            </button>

            <button class="tool-btn">
                ↺ Reset
            </button>

        </aside>


        <section class="workspace">

            <div class="upload-box">

                <div class="upload-icon">
                    🖼️
                </div>

                <h2>Upload Foto Anda</h2>

                <p>
                    Pilih foto JPG, PNG atau WEBP untuk mulai mengedit.
                </p>

                <label
                    for="fotoInput"
                    class="upload-btn"
                >
                    Pilih Foto
                </label>

                <input
                    type="file"
                    id="fotoInput"
                    accept="image/jpeg,image/png,image/webp"
                >

            </div>


            <div class="info">
                💎 Fitur Edit Foto manual ini gratis dan tidak mengurangi kredit NIVEXA AI.
            </div>

        </section>

    </div>

</main>

</body>
</html>
