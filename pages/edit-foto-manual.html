        body {

        .back-btn {

        }

        .download-btn {
    position: relative;
    z-index: 10;
    display: block;
    width: fit-content;
    margin-top: -45px;
    margin-left: 10px;
    margin-bottom: 10px;
    padding: 7px 12px;

    border-radius: 8px;
    background: rgba(20, 25, 40, 0.80);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

        .undo-redo {
    display: flex;
    justify-content: flex-end;
    gap: 0px;
    margin-top: -20px;
    padding-right: 2px;
    margin-right: 20px;

    position: relative;
top: -20px;
margin-bottom: -20px;
}

.undo-redo button {
    padding: 0;
    margin: 0;
    border: none;
    background: transparent;
    color: white;
    font-size: 24px;
    line-height: 1;

    box-shadow: none;
}

.undo-redo button:hover {
    background: transparent !important;
}

        .upload-box {
        position: relative;
            min-height: 440px;
            border: none;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .upload-icon {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .upload-box h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #9ba6bb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #6657ff, #437cff);
            padding: 13px 24px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        #fotoInput {
            display: none;
        }

        .info {
            margin-top: 18px;
            padding: 14px;
            background: rgba(64, 111, 255, 0.1);
            border: 1px solid rgba(90, 130, 255, 0.2);
            border-radius: 12px;
            color: #b9c8f7;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 800px) {
            .ratio-options.show {
    display: flex;
    position: sticky;
    bottom: 78px;
    z-index: 100;
    background: rgba(18, 24, 39, 0.96);
    padding: 8px 10px;
}
            .header {
                padding: 14px;
            }

            .brand-text p {
                display: none;
            }

            .editor-layout {
                grid-template-columns: 1fr;
            }

    .toolbar {
    order: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-content: flex-start;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 12px;

    overscroll-behavior-y: none;

}

.toolbar h3 {
    display: none;
}

.toolbar .tool-btn,
.toolbar .control-group {
    flex: 0 0 calc(25% - 8px);
    width: calc(25% - 8px);
    min-width: 0;
    max-width: 120px;
    padding: 10px 12px;
    margin-bottom: 0;
    font-size: 12px;
}
#resetBtn {
    display: none !important;
}

.toolbar .menu-icon-btn {
    background: transparent;
    border: none;
    box-shadow: none;

    display: flex;
    flex-direction: column;

}

.toolbar .menu-icon {
    display: block;

}

.toolbar .menu-label {
    display: block;

    text-align: center;
}
#mainTools {
    display: contents;
}
#mainTools > .tool-btn {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}
#mainTools > .tool-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-align: center;
}
.adjust-menu-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    background: transparent;
    border: none;
    box-shadow: none;

    text-align: center;
    width: 100%;
}

.adjust-menu-label .menu-icon {
    font-size: 24px;
    line-height: 1;
}

.adjust-menu-label .menu-label {
    font-size: 12px;
    line-height: 1.15;
}
#effectMenu {
    display: none;
    width: 100%;
    align-items: center;
    gap: 14px;
    overflow-x: auto;
    padding: 38px 6px 8px;
    box-sizing: border-box;
    position: relative;
}

#effectMenu .effect-choice {
    flex: 0 0 76px;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 4px;
    color: white;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

#effectMenu .effect-thumb {
    width: 58px;
    height: 58px;
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
    background: transparent;
}

#effectMenu .effect-choice span {
    font-size: 11px;
    white-space: nowrap;
}

#closeEffectMenu {
    position: absolute;
    right: 8px;
    top: 4px;
    min-width: 50px;
    height: 50px;

    background: transparent;
    border: none;
    color: white;
    font-size: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    align-self: flex-start;

    z-index: 23;
}

#adjustPanel {
    position: relative;
    display: none;
    flex-direction: row;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 8px;
    overflow-x: auto;
    width: 100%;
    padding-top: 0px;
    padding-bottom: 18px;
    max-height: 190px;
overflow-y: auto;
}
#selesaiAdjustBtn {
    position: sticky;
    top: -5px;
    right: 8px;
    margin-left: auto;

    width: 36px;
    min-width: 36px;
    max-width: 36px;

    padding: 0;
    margin-top: 0;
    margin-bottom: 0;

    background: transparent;
    border: none;
    box-shadow: none;

    font-size: 24px;
    line-height: 1;
    color: white;
    z-index: 50;
}

#adjustPanel .control-group,
#adjustPanel .tool-btn,
#adjustPanel .effect-wrapper {
    flex: 0 0 105px;
    width: 105px;
    min-width: 105px;
    max-width: 105px;
    box-sizing: border-box;
}

#adjustPanel .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;

    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
}


#adjustPanel input[type="range"] {
    width: 100%;
}
.effect-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 120px;
    overflow: visible;
}
.effect-wrapper .tool-btn {
    width: 100%;
    margin-bottom: 0;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}
.effect-wrapper .tool-btn {
    order: 1 !important;
}
#effectBtn {
    transform: translateY(-23px);
}
#effectControl {
    order: 2 !important;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#effectRange {
    width: 100px !important;
}
#effectControl {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 120px !important;
    min-width: 120px !important;
    padding: 0 8px 6px !important;
}

#effectRange {
    width: 100px !important;
}

#effectValue {
    text-align: center;
    font-size: 12px;
}
.toolbar .control-group {
    width: 125px;
}

.toolbar .control-group input[type="range"] {
    width: 100px;
}

            .workspace {
                order: 1;
                min-height: 520px;
                padding: 0 !important;
                margin-top: -35px;
            }

           .upload-box {
    width: 100%;
    max-width: 100%;
    min-height: 520px;
    padding: 0;
}
.workspace,
.upload-box {
    touch-action: none;
    overscroll-behavior: none;
}

#fotoPreview {
    width: 100%;
    max-width: 100%;
    height: 100%;
    max-height: none;
    object-fit: cover;
}
body {
    overflow-anchor: none;
}

.workspace {
    position: relative;
    min-height: 520px;
}

.upload-box {
    position: relative;
    min-height: 520px !important;
}

#fotoPreview {
    position: relative;
    top: 0;
    left: 0;
}
            .title h1 {
                font-size: 24px;
            }
        }
        .control-group {
    background: #20283a;
    padding: 12px 13px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.control-group label {
    display: block;
    font-size: 14px;
    margin-bottom: 9px;
    color: white;
}

.control-group input[type="range"] {
    width: 100%;
    cursor: pointer;
}
.ratio-options {
    display: none;
    width: 100%;
    flex-basis: 100%;
    gap: 6px;
    padding: 8px 0 0;
    flex-wrap: wrap;
    overflow: visible;
    order: 3;
width: 100%;
grid-column: 1 / -1;
}

.ratio-options.show {
    display: flex;
}

.ratio-options button {
    flex: 0 0 auto;
    padding: 10px 14px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #20283a;
    color: white;
    cursor: pointer;
    white-space: nowrap;
}
/* ===== MODE TAMBAH TEKS ===== */

#textPanel {
    display: none;
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 14px;
    z-index: 50;

    padding: 0;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    text-align: left;
}

/* Kolom ketik */
#textInput {
    width: calc(100% - 55px);
    height: 46px;
    padding: 0 14px;

    background: rgba(20, 20, 25, 0.72);
    color: white;

    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    outline: none;

    font-size: 16px;
    box-sizing: border-box;
}

#textInput::placeholder {
    color: rgba(255,255,255,0.65);
}
.text-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.text-input-row #textInput {
    flex: 1;
    width: auto;
}

#finishTextBtn {
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    color: white;
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
}

.font-category-row {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    white-space: nowrap;
    margin-bottom: 10px;
    padding: 2px 0 6px;
}

.font-category-row::-webkit-scrollbar {
    display: none;
}

.font-category {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    font-weight: 600;
    padding: 6px 2px;
    cursor: pointer;
}

.font-category.active {
    color: white;
    border-bottom: 2px solid white;
}

.font-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}

.font-btn {
    height: 40px;
    padding: 0 8px;

    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;

    background: rgba(20,20,25,0.72);
    color: white;

    font-size: 14px;
    cursor: pointer;
}

.font-btn.active {
    border: 2px solid white;
    background: rgba(255,255,255,0.12);
}

/* Pilihan warna baru */
.text-color-options {
    display: flex;
    gap: 10px;
    align-items: center;
    overflow-x: auto;
    padding: 10px 0;
}

.text-color-dot {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.45);
    padding: 0;
    cursor: pointer;
}

.text-color-dot.active {
    border: 3px solid #ffffff;
}

.resize-handle {
    position: absolute;
    right: -23px;
    bottom: -23px;

    width: 28px;
    height: 28px;
    border-radius: 50%;

    background: transparent;
    border: 2px solid white;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    font-weight: bold;

    cursor: nwse-resize;
    touch-action: none;
    user-select: none;

    z-index: 50;
}

.rotate-handle {
    position: absolute;
    left: -25px;
    top: -25px;

    width: 42px;
    height: 42px;
    border-radius: 50%;

    background: rgba(20, 25, 40, 0.9);
    border: 2px solid white;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
    font-weight: bold;

    cursor: grab;
    touch-action: none;
    user-select: none;

    z-index: 51;
}

/* Hilangkan bentuk tombol putih besar */
#addTextBtn,
#cancelTextBtn {
    width: 42px;
    height: 42px;

    margin-top: 8px;
    margin-right: 6px;
    padding: 0;

    border: none;
    border-radius: 50%;

    background: rgba(15, 23, 42, 0.82);
    color: white;

    font-size: 0;
    cursor: pointer;
}
#cropBox {
    touch-action: none;
}

/* Tombol selesai */
#addTextBtn::before {
    content: "✓";
    font-size: 24px;
}

/* Tombol batal */
#cancelTextBtn::before {
    content: "×";
    font-size: 28px;
}
#addTextBtn {
    position: absolute;
    right: 70px;
    bottom: 15px;
    z-index: 30;
}

#cancelTextBtn {
    position: absolute;
    left: auto;
    right: 15px;
    bottom: 70px;
    z-index: 30;
}

/* Saat disentuh */
#addTextBtn:active,
#cancelTextBtn:active {
    transform: scale(0.92);
}
.teks-tambahan {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;

    outline: 2px solid rgba(255,255,255,0.9);
    outline-offset: 5px;
    border-radius: 4px;
    white-space: nowrap;
}
#addTextBtn,
#cancelTextBtn {
    display: none !important;
}
#downloadBtn {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
}
#downloadBtn * {
    user-select: none;
    -webkit-user-select: none;
}
.mirror-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 16px;
    margin-right: 5px;
    gap: 2px;
}

.mirror-left,
.mirror-right {
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
}

.mirror-left {
    border-right: 7px solid currentColor;
}

.mirror-right {
    border-left: 7px solid currentColor;
}

.mirror-line {
    width: 1.5px;
    height: 15px;
    background: currentColor;
    border-radius: 2px;
}

</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">N</div>

        <div class="brand-text">
            <h2>NIVEXA AI</h2>
            <p>Edit Foto Manual</p>
        </div>
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Kembali
    </a>

</header>


<main class="container">


    <div class="editor-layout">

        <aside class="toolbar">

            <h3>Alat Edit</h3>

            <div id="mainTools">

      <button class="tool-btn menu-icon-btn" id="sesuaikanBtn">
    <span class="menu-icon">✨</span>
    <span class="menu-label">Sesuaikan</span>
</button>

          <button class="tool-btn menu-icon-btn" id="cropBtn">
    <span class="menu-icon">✂️</span>
    <span class="menu-label">Crop / Potong</span>
</button>

            <button class="tool-btn menu-icon-btn" id="putarBtn">
    <span class="menu-icon">↻</span>
    <span class="menu-label">Putar Foto</span>
</button>

            <button class="tool-btn menu-icon-btn" id="balikBtn">
    <span class="menu-icon">
        <span class="mirror-icon">
            <span class="mirror-left"></span>
            <span class="mirror-line"></span>
            <span class="mirror-right"></span>
        </span>
    </span>

    <span class="menu-label">Cermin</span>
</button>

<button class="tool-btn" id="textBtn" type="button">
    <span class="menu-icon">T</span>
<span class="menu-label">Tambah Teks</span>
</button>

<button class="tool-btn" id="overlayBtn" type="button">
    <span class="menu-icon">🖼️</span>
<span class="menu-label">Overlay</span>
</button>

<input
    type="file"
    id="overlayInput"
    accept="image/jpeg,image/png,image/webp"
    style="display:none;"
>

<button class="tool-btn" id="hapusBgOverlayBtn" type="button">
    <span class="menu-icon">🪄</span>
    <span class="menu-label">Hapus BG Overlay</span>
</button>

<button class="tool-btn" id="ratioBtn" type="button">
    <span class="menu-icon">◩</span>
    <span class="menu-label">Rasio</span>
</button>

<button class="tool-btn" id="resetBtn" type="button">
    <span class="menu-icon">↻</span>
    <span class="menu-label">Reset</span>
</button>

</div>
<div id="adjustPanel" style="display: none;">

    <div class="effect-wrapper">

    <div id="effectControl" style="display: none;">
        <input
            type="range"
            id="effectRange"
            min="0"
            max="100"
            value="0"
        >
        <span id="effectValue">0</span>
    </div>
<button class="tool-btn menu-icon-btn" id="effectBtn" type="button">
    <span class="menu-icon">✨</span>
    <span class="menu-label">Efek</span>
</button>
</div>

<div id="effectMenu" style="display: none;">

    <button type="button" class="effect-choice" data-effect="none">
        <div class="effect-thumb">🖼️</div>
        <span>Asli</span>
    </button>

    <button type="button" class="effect-choice" data-effect="warm">
        <div class="effect-thumb">🌅</div>
        <span>Hangat</span>
    </button>

    <button type="button" class="effect-choice" data-effect="cool">
        <div class="effect-thumb">❄️</div>
        <span>Dingin</span>
    </button>

    <button type="button" class="effect-choice" data-effect="bw">
        <div class="effect-thumb">⚪</div>
        <span>Hitam Putih</span>
    </button>

    <button type="button" class="effect-choice" data-effect="vintage">
        <div class="effect-thumb">📷</div>
        <span>Vintage</span>
    </button>

    <button id="closeEffectMenu" type="button">
        ✓

currentOverlay.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "touch" && !e.isPrimary) {
        sedangGeser = false;
        return;

    mulaiX = e.clientX;

    const deltaX = e.clientX - mulaiX;
    const deltaY = e.clientY - mulaiY;

    currentOverlay.style.left =
        (posisiAwalX + deltaX) + "px";

    currentOverlay.style.top =
        (posisiAwalY + deltaY) + "px";

    currentOverlay.style.bottom = "auto";
});

currentOverlay.addEventListener("pointerup", function (e) {

    if (currentOverlay.hasPointerCapture(e.pointerId)) {

    if (e.target.id !== "applyCropBtn") return;

    const foto = document.getElementById("fotoPreview");
    const cropBox = document.getElementById("cropBox");

    if (!foto || !cropBox) return;

    const fotoRect = foto.getBoundingClientRect();
    const cropRect = cropBox.getBoundingClientRect();

    const naturalW = foto.naturalWidth;
    const naturalH = foto.naturalHeight;

    if (!naturalW || !naturalH) return;

    // Karena fotoPreview memakai object-fit: cover
    const scale = Math.max(
        fotoRect.width / naturalW,
        fotoRect.height / naturalH
    );

    const tampilW = naturalW * scale;
    const tampilH = naturalH * scale;

    const offsetX = (tampilW - fotoRect.width) / 2;
    const offsetY = (tampilH - fotoRect.height) / 2;

    const xDiFoto = cropRect.left - fotoRect.left;
    const yDiFoto = cropRect.top - fotoRect.top;

    const sourceX = (xDiFoto + offsetX) / scale;
    const sourceY = (yDiFoto + offsetY) / scale;

    const sourceW = cropRect.width / scale;
    const sourceH = cropRect.height / scale;

    const canvas = document.createElement("canvas");

    canvas.width = Math.round(sourceW);
    canvas.height = Math.round(sourceH);

    const ctx = canvas.getContext("2d");

    ctx.drawImage(
        foto,
        sourceX,
        sourceY,
        sourceW,
        sourceH,
        0,
        0,
        canvas.width,
        canvas.height
    );

    foto.src = canvas.toDataURL("image/png");

    cropBox.remove();

    const cropActions =
        document.getElementById("cropActions");

    if (cropActions) {
        cropActions.style.display = "none";
    }

    const awalX = e.clientX - tengahX;
    const awalY = e.clientY - tengahY;

    const jarakAwal =
        Math.sqrt(
            awalX * awalX +
            awalY * awalY
        );

    const sudutAwal =
        Math.atan2(awalY, awalX);

        const sekarangX =
            ev.clientX - tengahX;

        const sekarangY =

        const jarakSekarang =
            Math.sqrt(
                sekarangX * sekarangX +
                sekarangY * sekarangY
            );

        const sudutSekarang =
            Math.atan2(
                sekarangY,
                sekarangX
            );

        /* BESAR / KECIL */
        let ukuranBaru =
            ukuranAwal *
            (jarakSekarang / jarakAwal);

        ukuranBaru =
            Math.max(
                14,
                Math.min(120, ukuranBaru)
            );

        elemenTeks.style.fontSize =
            ukuranBaru + "px";

        /* PUTAR */
        const selisihSudut =
            (sudutSekarang - sudutAwal) *
            180 / Math.PI;

        const rotasiBaru =
            rotasiAwal + selisihSudut;

        elemenTeks.style.rotate =
            rotasiBaru + "deg";

        elemenTeks.dataset.rotasi =
            rotasiBaru;
    }

    function selesaiUbah() {
        window.removeEventListener(
            "pointermove",
            ubahTeks
        );

        window.removeEventListener(
            "pointerup",
            selesaiUbah
        );
    }

    window.addEventListener(
        "pointermove",
        ubahTeks
    );

        "pointerup",

    );

            alert("Pilih foto terlebih dahulu.");
            return;
        }

        rotasi = 0;
        balikX = 1;

        brightnessRange.value = 100;
        contrastRange.value = 100;
        saturationRange.value = 100;

        filterTambahan = "";

        foto.style.transform = "";
        foto.style.filter = "";

if (overlayImage) {
    overlayImage.remove();
    overlayImage = null;
}

        updateTransformFoto();
        updateFilterFoto();
    });

    document
    .getElementById("downloadBtn")
    .addEventListener("click", function () {

        const foto =
            document.getElementById("fotoPreview");

        if (!foto) {
            alert("Pilih foto terlebih dahulu.");
            return;
        }

        const canvas =
            document.createElement("canvas");

        const ctx =
            canvas.getContext("2d");

       const rasioAktif =
    document.querySelector("#ratioOptions button.active")
        ?.getAttribute("data-ratio") || "Asli";

if (rasioAktif === "1:1") {
    canvas.width = 1080;
    canvas.height = 1080;
} else if (rasioAktif === "4:5") {
    canvas.width = 1080;
    canvas.height = 1350;
} else if (rasioAktif === "9:16") {
    canvas.width = 1080;
    canvas.height = 1920;
} else if (rasioAktif === "16:9") {
    canvas.width = 1920;
    canvas.height = 1080;
} else {
    canvas.width = foto.naturalWidth;
    canvas.height = foto.naturalHeight;
}

ctx.filter =
    foto.style.filter || "none";

const skalaFoto = Math.max(
    canvas.width / foto.naturalWidth,
    canvas.height / foto.naturalHeight
);

const lebarFoto =
    foto.naturalWidth * skalaFoto;

const tinggiFoto =
    foto.naturalHeight * skalaFoto;

ctx.save();

ctx.translate(
    canvas.width / 2,
    canvas.height / 2
);

ctx.rotate(
    rotasi * Math.PI / 180
);

ctx.scale(
    balikX,
    1
);

ctx.drawImage(
    foto,
    -lebarFoto / 2,
    -tinggiFoto / 2,
    lebarFoto,
    tinggiFoto
);

ctx.restore();
if (overlayImage) {
    const parent =
        foto.parentElement;

    const fotoRect =
        foto.getBoundingClientRect();

    const overlayRect =
        overlayImage.getBoundingClientRect();

    const scaleX =
        canvas.width / fotoRect.width;

    const scaleY =
        canvas.height / fotoRect.height;

    const overlayX =
        (overlayRect.left - fotoRect.left) * scaleX;

    const overlayY =
        (overlayRect.top - fotoRect.top) * scaleY;

    const overlayWidth =
        overlayRect.width * scaleX;

    const overlayHeight =
        overlayRect.height * scaleY;

    ctx.save();

    ctx.filter = "none";

    ctx.drawImage(
        overlayImage,
        overlayX,
        overlayY,
        overlayWidth,
        overlayHeight
    );

    ctx.restore();
}
         const teksTambahan =
    foto.parentElement.querySelectorAll(
        ".teks-tambahan"
    );

const fotoRectTeks =
    foto.getBoundingClientRect();

const scaleXTeks =
    canvas.width / fotoRectTeks.width;

const scaleYTeks =
    canvas.height / fotoRectTeks.height;

teksTambahan.forEach(function (item) {

    const teksRect =
        item.getBoundingClientRect();

    const teksX =
        (teksRect.left - fotoRectTeks.left + teksRect.width / 2)
        * scaleXTeks;

    const teksY =
        (teksRect.top - fotoRectTeks.top + teksRect.height / 2)
        * scaleYTeks;

    const ukuranFont =
        parseFloat(
            window.getComputedStyle(item).fontSize
        ) * scaleYTeks;

    const gaya =
        window.getComputedStyle(item);

    ctx.save();

    ctx.font =
        `${gaya.fontWeight} ${ukuranFont}px ${gaya.fontFamily}`;

    ctx.fillStyle =
        gaya.color;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "rgba(0,0,0,0.55)";
    ctx.shadowBlur = 8;

    ctx.fillText(
        item.textContent,
        teksX,
        teksY
    );

    ctx.restore();
});

        canvas.toBlob(function (blob) {

            if (!blob) {
    alert("Foto gagal disimpan. Coba lagi.");
    return;
}

            const url = URL.createObjectURL(blob);

const link = document.createElement("a");
link.href = url;
link.download = "nivexa-edit-foto.jpg";
link.style.display = "none";

document.body.appendChild(link);

link.click();

setTimeout(function () {
    link.remove();
    URL.revokeObjectURL(url);
}, 3000);
        }, "image/jpeg", 0.95);
    });
