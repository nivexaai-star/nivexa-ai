<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - NIVEXA AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, rgba(49, 98, 255, 0.28), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(91, 55, 255, 0.25), transparent 35%),
                linear-gradient(135deg, #07122e, #101a48 50%, #08132f);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 18px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
            font-weight: 900;

            background: linear-gradient(
                135deg,
                #536dff,
                #39d5ff
            );

            box-shadow: 0 12px 35px rgba(50, 150, 255, 0.35);
        }

        .brand h1 {
            font-size: 32px;
            margin-bottom: 7px;
        }

        .brand p {
            color: #b8c3e4;
            font-size: 15px;
        }

        .register-card {
            background: rgba(20, 35, 85, 0.70);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 28px;
            padding: 32px;

            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            backdrop-filter: blur(15px);
        }

        .register-card h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b9c5e5;
            margin-bottom: 27px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 56px;

            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 15px;

            background: rgba(6, 18, 55, 0.48);
            color: white;

            padding: 0 17px;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #8998bd;
        }

        input:focus {
            border-color: #63cfff;
            box-shadow: 0 0 0 3px rgba(67, 194, 255, 0.12);
        }

        .register-button {
            width: 100%;
            height: 58px;

            margin-top: 7px;

            border: none;
            border-radius: 16px;

            color: white;
            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #58caff,
                #7782ff,
                #b478ff
            );

            box-shadow: 0 10px 30px rgba(81, 151, 255, 0.25);
        }

        .register-button:hover {
            transform: translateY(-1px);
        }

        #pesan {
            min-height: 24px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 23px;
            color: #b9c5e5;
        }

        .login-link a {
            color: #74d8ff;
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding-top: 25px;
            }

            .register-card {
                padding: 24px 19px;
                border-radius: 22px;
            }

            .brand h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="register-wrapper">

    <div class="brand">
        <div class="logo">N</div>

        <h1>NIVEXA AI</h1>

        <p>AI Creative Studio</p>
    </div>

    <div class="register-card">

        <h2>Buat Akun</h2>

        <p class="subtitle">
            Daftar untuk mulai menggunakan NIVEXA AI.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="nama">Nama</label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama kamu"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimal 6 karakter"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="konfirmasiPassword">
                    Konfirmasi Password
                </label>

                <input
                    type="password"
                    id="konfirmasiPassword"
                    placeholder="Ulangi password"
                    minlength="6"
                    required
                >
            </div>

            <button
                type="submit"
                class="register-button"
            >
                DAFTAR
            </button>

            <div id="pesan"></div>

        </form>

        <div class="login-link">
            Sudah punya akun?
            <a href="login.html">Login Sekarang</a>
        </div>

    </div>

</div>


<script>
    const registerForm =
        document.getElementById("registerForm");

    const pesan =
        document.getElementById("pesan");


    registerForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            const nama =
                document.getElementById("nama")
                .value.trim();

            const email =
                document.getElementById("email")
                .value.trim()
                .toLowerCase();

            const password =
                document.getElementById("password")
                .value;

            const konfirmasiPassword =
                document.getElementById(
                    "konfirmasiPassword"
                ).value;


            if (
                !nama ||
                !email ||
                !password ||
                !konfirmasiPassword
            ) {
                tampilkanPesan(
                    "Semua data harus diisi.",
                    false
                );

                return;
            }


            if (password.length < 6) {
                tampilkanPesan(
                    "Password minimal 6 karakter.",
                    false
                );

                return;
            }


            if (
                password !==
                konfirmasiPassword
            ) {
                tampilkanPesan(
                    "Konfirmasi password tidak sama.",
                    false
                );

                return;
            }


            const akun = {
                nama: nama,
                email: email,
                password: password,

                sisaGratis: 3,

                dibuatPada:
                    new Date().toISOString()
            };


            localStorage.setItem(
                "nivexaAccount",
                JSON.stringify(akun)
            );


            localStorage.setItem(
                "nivexaUser",
                JSON.stringify({
                    email: email,
                    loginAt:
                        new Date().toISOString()
                })
            );

fetch("/register-user", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        email: email
    })
})
.then(response => response.json())
.then(data => {
    console.log("Register server:", data);
})
.catch(error => {
    console.error("Gagal register ke server:", error);
});
            tampilkanPesan(
                "Akun berhasil dibuat. Kamu mendapat 3 kredit gratis.",
                true
            );


            setTimeout(function () {

                window.location.href =
                    "dashboard.html";

            }, 900);
        }
    );


    function tampilkanPesan(
        text,
        berhasil
    ) {

        pesan.textContent = text;

        pesan.style.color =
            berhasil
                ? "#75f0bd"
                : "#ff9ca8";
    }
</script>

</body>
</html>
