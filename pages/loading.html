<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIVEXA AI - Memproses Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(31, 137, 255, 0.24),
                    transparent 36%
                ),
                linear-gradient(
                    160deg,
                    #020713,
                    #071b3b 55%,
                    #020711
                );
            color: white;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.22;
            pointer-events: none;
        }

        body::before {
            top: -180px;
            left: -160px;
            background: #8a42ff;
        }

        body::after {
            right: -170px;
            bottom: -180px;
            background: #16d7ff;
        }

        .loading-card {
            position: relative;
            z-index: 1;
            width: min(620px, 100%);
            padding: 48px 34px;
            text-align: center;
            border: 1px solid rgba(103, 192, 255, 0.22);
            border-radius: 28px;
            background: rgba(4, 15, 36, 0.8);
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
        }

        .logo-wrap {
            width: 128px;
            height: 128px;
            margin: 0 auto 24px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    rgba(135, 62, 255, 0.5),
                    rgba(32, 212, 255, 0.5)
                );
            box-shadow:
                0 0 45px rgba(55, 189, 255, 0.28),
                0 0 80px rgba(117, 67, 255, 0.18);
            animation: bernapas 2.2s ease-in-out infinite;
        }

        .logo {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            object-fit: cover;
        }

        .badge {
            display: inline-flex;
            margin-bottom: 18px;
            padding: 9px 16px;
            border: 1px solid rgba(72, 210, 255, 0.38);
            border-radius: 999px;
            background: rgba(13, 61, 105, 0.35);
            color: #55dcff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        h1 {
            margin-bottom: 13px;
            font-size: clamp(31px, 6vw, 45px);
        }

        .description {
            max-width: 470px;
            margin: 0 auto;
            color: #adbed4;
            font-size: 16px;
            line-height: 1.7;
        }

        .process-box {
            margin-top: 38px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 19px;
            background: rgba(255, 255, 255, 0.025);
        }

        .process-top {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        #statusText {
            color: #ddecff;
            font-weight: bold;
            text-align: left;
        }

        #percentageText {
            color: #4bdcff;
            font-size: 18px;
            font-weight: bold;
        }

        .progress-track {
            width: 100%;
            height: 15px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background:
                linear-gradient(
                    90deg,
                    #8546ff,
                    #3477ff,
                    #20d5ff
                );
            box-shadow: 0 0 24px rgba(45, 200, 255, 0.48);
            transition: width 0.25s ease;
        }

        .tip {
            margin-top: 22px;
            color: #7890ad;
            font-size: 13px;
            line-height: 1.6;
        }

        .success-message {
            display: none;
            margin-top: 22px;
            padding: 15px;
            border: 1px solid rgba(76, 227, 173, 0.28);
            border-radius: 14px;
            background: rgba(17, 123, 87, 0.14);
            color: #6ff0bf;
            font-weight: bold;
        }

        @keyframes bernapas {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.07);
            }
        }

        @media (max-width: 600px) {
            .loading-card {
                padding: 38px 20px;
                border-radius: 22px;
            }

            .logo-wrap {
                width: 108px;
                height: 108px;
            }

            .process-box {
                padding: 19px 15px;
            }
        }
    </style>
</head>

<body>
    <main class="loading-card">
        <div class="logo-wrap">
            <img
                src="../assets/images/logo.png"
                alt="Logo NIVEXA AI"
                class="logo"
            >
        </div>

        <div class="badge">
            ✨ NIVEXA AI PROCESSING
        </div>

        <h1>AI Sedang Bekerja...</h1>

        <p class="description">
            Mohon tunggu beberapa saat. NIVEXA AI sedang memproses
            foto dan menyiapkan video terbaik untuk Anda.
        </p>

        <section class="process-box">
            <div class="process-top">
                <span id="statusText">Menganalisis foto...</span>
                <span id="percentageText">0%</span>
            </div>

            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <p class="tip">
                Jangan menutup halaman ini selama proses berlangsung.
            </p>
        </section>

        <div id="successMessage" class="success-message">
            ✅ Video berhasil diproses. Membuka halaman hasil...
        </div>
    </main>

    <script>
        const progressBar = document.getElementById("progressBar");
        const percentageText = document.getElementById("percentageText");
        const statusText = document.getElementById("statusText");
        const successMessage = document.getElementById("successMessage");

        const stages = [
            {
                limit: 20,
                text: "Menganalisis foto..."
            },
            {
                limit: 43,
                text: "Mengenali wajah dan objek..."
            },
            {
                limit: 68,
                text: "Membuat gerakan AI..."
            },
            {
                limit: 88,
                text: "Merender video..."
            },
            {
                limit: 100,
                text: "Menyelesaikan hasil video..."
            }
        ];

        let progress = 0;

        const progressInterval = setInterval(function () {
            const increment = Math.floor(Math.random() * 4) + 1;
            progress = Math.min(progress + increment, 100);

            progressBar.style.width = progress + "%";
            percentageText.textContent = progress + "%";

            const currentStage = stages.find(function (stage) {
                return progress <= stage.limit;
            });

            if (currentStage) {
                statusText.textContent = currentStage.text;
            }

            if (progress >= 100) {
                clearInterval(progressInterval);

                statusText.textContent = "Video berhasil dibuat!";
                successMessage.style.display = "block";

                setTimeout(function () {
                    window.location.href = "result.html";
                }, 1800);
            }
        }, 170);
    </script>
</body>
</html>
