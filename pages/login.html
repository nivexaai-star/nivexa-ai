<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivexa AI - Login</title>

    <link rel="stylesheet" href="../assets/css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>

<div class="login-container">

    <div class="logo">
        <h1>NIVEXA AI</h1>
        <p>The Future of AI Creativity</p>
    </div>

    <div class="login-card">

        <h2>Welcome Back 👋</h2>

        <p class="subtitle">
            Login untuk melanjutkan ke Dashboard Nivexa AI
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Masukkan Email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan Password"
                required
            >

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">
                    Lupa Password?
                </a>

            </div>

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div class="divider">
            OR
        </div>

        <button class="google-btn">
            Continue with Google
        </button>

        <p class="register">

            Belum punya akun?

            <a href="register.html">
                Daftar Sekarang
            </a>

        </p>

    </div>

</div>

<script src="../assets/js/login.js"></script>

</body>
</html>
